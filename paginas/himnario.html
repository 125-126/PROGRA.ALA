<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Himnario | Ministerio de Alabanza</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --azul:#0B1F3A;
    --azul2:#123D72;
    --azul3:#1565C0;
    --dorado:#D4AF37;
    --blanco:#ffffff;
    --gris:#d9e2ef;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:#081a31;
    color:white;
    min-height:100vh;
}

/* =========================
   ENCABEZADO
========================= */

header{
    height:70px;
    background:linear-gradient(135deg,#081C3A,#123D72);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid rgba(255,255,255,.12);
    box-shadow:0 4px 18px rgba(0,0,0,.35);
}

.titulo{
    display:flex;
    align-items:center;
    gap:13px;
}

.icono{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,#D4AF37,#f2d675);
    color:#0B1F3A;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.titulo h1{
    font-size:21px;
    font-weight:700;
    letter-spacing:.5px;
}

.titulo span{
    display:block;
    font-size:11px;
    color:#cbd8e8;
    margin-top:1px;
}

/* =========================
   BOTÓN
========================= */

.boton-abrir{
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg,#1565C0,#1976D2);
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    transition:.25s;
}

.boton-abrir:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#1976D2,#2196F3);
}

/* =========================
   CONTENIDO
========================= */

.contenido{
    padding:18px;
    max-width:1400px;
    margin:auto;
}

.presentacion{
    background:linear-gradient(
        135deg,
        rgba(21,101,192,.22),
        rgba(255,255,255,.05)
    );

    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;

    padding:14px 17px;
    margin-bottom:15px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    backdrop-filter:blur(10px);
}

.presentacion h2{
    font-size:16px;
    margin-bottom:3px;
}

.presentacion p{
    font-size:11px;
    color:#cbd8e8;
}

.estado{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:10px;
    color:#b9c9da;
    white-space:nowrap;
}

.punto{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#35d07f;
    box-shadow:0 0 8px #35d07f;
}

/* =========================
   VISOR
========================= */

.visor{
    background:#20252b;
    border-radius:15px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.visor-barra{
    height:42px;
    background:#15191e;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    color:#cbd3dc;
    font-size:11px;
}

.visor-barra-izq{
    display:flex;
    align-items:center;
    gap:8px;
}

.circulo{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#D4AF37;
}

.pdf{
    width:100%;
    height:calc(100vh - 190px);
    min-height:500px;
    border:none;
    display:block;
    background:white;
}

/* =========================
   PIE
========================= */

footer{
    text-align:center;
    padding:12px;
    color:#91a5bc;
    font-size:10px;
}

footer strong{
    color:#D4AF37;
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    header{
        height:62px;
        padding:0 12px;
    }

    .icono{
        width:36px;
        height:36px;
        border-radius:10px;
        font-size:18px;
    }

    .titulo{
        gap:9px;
    }

    .titulo h1{
        font-size:17px;
    }

    .titulo span{
        font-size:9px;
    }

    .boton-abrir{
        padding:8px 10px;
        font-size:10px;
        border-radius:8px;
    }

    .boton-abrir span{
        display:none;
    }

    .contenido{
        padding:10px;
    }

    .presentacion{
        padding:11px 12px;
        margin-bottom:10px;
        border-radius:12px;
    }

    .presentacion h2{
        font-size:13px;
    }

    .presentacion p{
        font-size:9px;
    }

    .estado{
        font-size:8px;
    }

    .visor{
        border-radius:10px;
    }

    .visor-barra{
        height:34px;
        padding:0 10px;
        font-size:9px;
    }

    .pdf{
        height:calc(100vh - 155px);
        min-height:400px;
    }

    footer{
        display:none;
    }
}

</style>
</head>

<body>

<header>

    <div class="titulo">

        <div class="icono">
            ♪
        </div>

        <div>
            <h1>Himnario</h1>
            <span>Ministerio de Alabanza</span>
        </div>

    </div>

    <a
        href="himnario.pdf"
        target="_blank"
        class="boton-abrir"
    >
        ↗ <span>Abrir Himnario</span>
    </a>

</header>


<div class="contenido">

    <div class="presentacion">

        <div>
            <h2>📖 Himnario de Alabanza</h2>

            <p>
                Consulta los himnos directamente desde la aplicación.
            </p>
        </div>

        <div class="estado">
            <div class="punto"></div>
            Disponible
        </div>

    </div>


    <div class="visor">

        <div class="visor-barra">

            <div class="visor-barra-izq">
                <div class="circulo"></div>
                Vista del Himnario
            </div>

            <div>
                PDF
            </div>

        </div>

        <iframe
            class="pdf"
            src="himnario.pdf"
            title="Himnario"
        ></iframe>

    </div>

</div>


<footer>
    <strong>Ministerio de Alabanza</strong>
    · Himnario
</footer>


</body>
</html>
